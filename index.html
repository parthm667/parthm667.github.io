    <!-- The room's four faces are self-hosted: Bebas for anything that
         would be printed on a film canister, Inter Tight for reading,
         a mono for exposure data, Caveat for grease pencil. The two
         used above the fold are preloaded; /public_remediation fetches
         its own faces when that route mounts. -->
    <link rel="preload" href="/fonts/bebas.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-tight.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      // SPA GitHub Pages fallback restore (rafgraph technique).
      // When 404.html redirects with /?/<original-path>, replay the URL
      // before React mounts so BrowserRouter sees the right path.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script>
      // Settle the room before first paint, so the safelight never
      // flickers and a light-theme visitor never sees the dark one.
      // Only the landing route is a darkroom.
      (function () {
        try {
          var p = window.location.pathname;
          if (p !== '/' && p !== '/index.html') return;
          var root = document.documentElement;
          root.dataset.room = 'darkroom';
          var lit = localStorage.getItem('lights') === 'on';
          root.dataset.lights = lit ? 'on' : 'off';
          document.querySelector('meta[name="theme-color"]').content = lit ? '#cfc8b8' : '#080706';
        } catch (e) {}
      }());
    </script>
